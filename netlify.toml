[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# Local full-stack dev (Vite + functions): npm run dev:full  ->  http://localhost:8888
[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"

# Branch deploy for the `demo` branch: locked to mock mode (no live sources, no real emails).
[context.demo.environment]
  FORCE_MOCK = "true"

# SPA fallback + security headers
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
