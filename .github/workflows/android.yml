# Builds the Android app (APK) from the "android" branch. No Netlify credits used.
# Download: the "android-latest" release (open it on your phone), or the run's Artifacts.
name: Android app

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the screens (they talk to the live site's server)
        run: npm run build
        env:
          VITE_API_BASE: https://tradinganis.netlify.app
          VITE_APP_BUILD: ${{ github.run_number }} # the app compares this with the release page to offer updates
      - name: Copy them into the Android project
        run: npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name it
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Trading.apk
      - uses: actions/upload-artifact@v6
        with:
          name: Trading-apk
          path: Trading.apk
          retention-days: 30
      - name: Put it on the "android-latest" release (easy download on the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --target android --prerelease --title "Android app (latest)" --notes "Open this page on your Android phone and tap Trading.apk to install or update."
          gh release upload android-latest Trading.apk --clobber
          gh release edit android-latest --notes "Latest build: run ${{ github.run_number }} (version 1.0.${{ github.run_number }}), commit ${GITHUB_SHA::7}. Open this page on your Android phone and tap Trading.apk to install or update."
